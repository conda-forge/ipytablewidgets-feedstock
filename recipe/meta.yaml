{% set name = "ipytablewidgets" %}
{% set version = "0.3.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ipytablewidgets-{{ version }}.tar.gz
  sha256: 9e2e3ddf7926fa678e6d3d77d61b0f581724841c236416d0546d227a93718d19

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - jupyter_packaging >=0.10,<2
    - jupyterlab >=3.0.0,<3.7
    - setuptools >=40.8.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - ipywidgets >=7.5.0,<9
    - traitlets >=4.3.0
    - traittypes >=0.0.6
    - numpy >=1.10.4,<3.0.0
    - pandas >=1.0.0,<4
    - lz4

test:
  imports:
    - ipytablewidgets
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/progressivis/ipytablewidgets
  summary: A set of widgets to help facilitate reuse of large tables across widgets
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xtianpoli
    - ocefpaf
